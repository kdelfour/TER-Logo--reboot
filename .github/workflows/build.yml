name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Interpréteur (logo_core)
        working-directory: packages/logo_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Application
        run: |
          flutter pub get
          flutter analyze
          flutter test

  package:
    name: Paquets .deb et .rpm
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm patchelf
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Compilation et empaquetage
        run: |
          flutter pub get
          scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paquets-linux
          path: dist/*
          if-no-files-found: error

  verify:
    name: Installation sur ${{ matrix.image }}
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: debian:12
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: opensuse/tumbleweed
            install: zypper --non-interactive --no-gpg-checks install ./dist/*.rpm
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquets-linux
          path: dist
      - name: Installation
        run: ${{ matrix.install }}
      - name: Vérification
        run: |
          test -x /usr/bin/ter-logo-reboot
          test -f /usr/share/applications/io.github.kdelfour.TerLogoReboot.desktop
          ldd /opt/ter-logo-reboot/ter-logo-reboot
          missing=$(ldd /opt/ter-logo-reboot/ter-logo-reboot /opt/ter-logo-reboot/lib/*.so | grep 'not found' || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          echo "Toutes les bibliothèques sont présentes."

  release:
    name: Publication
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquets-linux
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
